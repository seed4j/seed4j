name: build
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  #------------------------------------------------------
  # Setup values which is going to be used in other jobs
  #------------------------------------------------------
  setup:
    name: setup
    runs-on: ubuntu-latest
    outputs:
      skip_ci: ${{ steps.check-ci-skip.outputs.skip_ci }}
      maven_cache_week: ${{ steps.maven-cache-week.outputs.week }}
      maven_cache_previous_week: ${{ steps.maven-cache-week.outputs.previous_week }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Get the head commit message
        id: commit-message
        run: |
          head_commit_message=$(git log -1 --no-merges --pretty=%B | tr '\n' ' ' | sed "s/'/'\\\\''/g")
          echo head commit message: $head_commit_message
          echo "message=$head_commit_message" >> $GITHUB_OUTPUT
      - name: Prepare commit message and PR title
        id: prepare-messages
        env:
          COMMIT_MESSAGE: ${{ steps.commit-message.outputs.message }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          commit_message=$(echo "$COMMIT_MESSAGE" | tr -cd '[:alnum:][:space:]\[\]')
          pr_title=$(echo "$PR_TITLE" | tr -cd '[:alnum:][:space:]\[\]')
          echo "commit_message=$commit_message" >> $GITHUB_OUTPUT
          echo "pr_title=$pr_title" >> $GITHUB_OUTPUT
      - name: Check for ci skip tags
        id: check-ci-skip
        run: |
          commit_message='${{ steps.prepare-messages.outputs.commit_message }}'
          pr_title='${{ steps.prepare-messages.outputs.pr_title }}'
          skip_tags=('[ci ignore]' '[ignore ci]')

          echo "Checking commit message and pr title for ci skip tags..."
          skip_ci="false"

          for tag in "${skip_tags[@]}"; do
            if [[ "$commit_message" == *"$tag"* ]] || [[ "$pr_title" == *"$tag"* ]]; then
              echo "Found ci skip tag '$tag'."
              echo "skip_ci=true" >> $GITHUB_OUTPUT
              skip_ci="true"
              break
            fi
          done

          if [[ "$skip_ci" == "false" ]]; then
            echo "No ci skip tag found."
            echo "skip_ci=false" >> $GITHUB_OUTPUT
          fi
      - name: Compute Maven cache week
        id: maven-cache-week
        # The global Maven cache is rebuilt from scratch every ISO week, so outdated dependencies expire
        run: |
          echo "week=$(date -u +%G-W%V)" >> $GITHUB_OUTPUT
          echo "previous_week=$(date -u -d '7 days ago' +%G-W%V)" >> $GITHUB_OUTPUT
  #--------------------------------------------------
  # Build and Tests the project on Windows
  #--------------------------------------------------
  tests-windows:
    name: tests-windows
    needs: [setup]
    runs-on: windows-2025
    timeout-minutes: 20
    if: >-
      needs.setup.outputs.skip_ci != 'true'
    steps:
      - name: 'Setup: checkout project'
        uses: actions/checkout@v7
      - name: 'Setup: environment'
        id: setup
        uses: ./.github/actions/setup
      - name: 'Init: restore local Maven repository'
        id: restore-maven-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: 'Init: install Node.js packages'
        run: npm ci
      - name: 'Test: run backend tests'
        run: |
          ./mvnw clean verify
      - name: 'Save local Maven repository'
        if: github.ref == 'refs/heads/main' && steps.restore-maven-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/repository
          key: ${{ steps.restore-maven-cache.outputs.cache-primary-key }}
  #--------------------------------------------------
  # Build and Tests the project on Linux
  #--------------------------------------------------
  tests-linux:
    name: tests-linux
    needs: [setup]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      needs.setup.outputs.skip_ci != 'true'
    steps:
      - name: 'Setup: checkout project'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 'Setup: environment'
        id: setup
        uses: ./.github/actions/setup
      - name: 'Init: restore global Maven cache'
        uses: ./.github/actions/maven-cache-restore
        with:
          week: ${{ needs.setup.outputs.maven_cache_week }}
          fallback-week: ${{ github.event_name == 'pull_request' && needs.setup.outputs.maven_cache_previous_week || '' }}
      - name: 'Init: install Node.js packages'
        run: npm ci
      - name: 'Lint: check'
        run: npm run lint:ci
      - name: 'Start local Sonar'
        run: docker compose -f src/main/docker/sonar.yml up -d
      - name: 'Test: run backend tests'
        run: |
          chmod +x mvnw
          ./mvnw clean verify -Dsonar.qualitygate.wait=true
      - name: 'Analysis: local Sonar'
        run: |
          docker logs sonar
          docker logs sonar-token
          SONAR_TOKEN=$(docker logs sonar-token)
          ./mvnw initialize sonar:sonar -Dsonar.token=$SONAR_TOKEN
          ./tests-ci/sonar.sh
      - name: 'Analysis: see results'
        run: ./tests-ci/sonar.sh
      - name: 'Analysis: SonarCloud'
        if: github.repository == 'seed4j/seed4j' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw initialize sonar:sonar -Dsonar.host.url=https://sonarcloud.io -Dsonar.projectKey=seed4j_seed4j -Dsonar.organization=seed4j
      - name: 'Artifact: remove unused JARs'
        run: |
          rm target/*-javadoc.jar target/*-sources.jar
      - name: 'Artifact: upload JAR'
        uses: actions/upload-artifact@v7
        with:
          name: seed4j-jar
          path: '${{ github.workspace }}/target/*.jar'
          retention-days: 1
      - name: 'Maven cache: upload downloaded dependencies'
        if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: ./.github/actions/maven-cache-delta
        with:
          name: seed4j
  #------------------------------------------------------
  # Build and Upload *.jar from main branch on Linux
  #------------------------------------------------------
  generate-main-branch-jar:
    name: generate-main-branch-jar
    needs: [setup]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      needs.setup.outputs.skip_ci != 'true' &&
      github.event_name == 'pull_request'
    steps:
      - name: 'Setup: checkout project'
        uses: actions/checkout@v7
        with:
          ref: 'main'
          fetch-depth: 0
      - name: 'Setup: environment'
        id: setup
        uses: ./.github/actions/setup
      # Local actions come from the main branch checkout here, so the global cache restore is inlined
      - name: 'Init: restore global Maven cache'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: Linux-m2-global-${{ needs.setup.outputs.maven_cache_week }}-
          restore-keys: |
            Linux-m2-global-${{ needs.setup.outputs.maven_cache_week }}-
            Linux-m2-global-${{ needs.setup.outputs.maven_cache_previous_week }}-
      - name: 'Init: install Node.js packages'
        run: npm ci
      - name: 'Build application JAR'
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests
      - name: 'Artifact: upload JAR'
        uses: actions/upload-artifact@v7
        with:
          name: seed4j-main-jar
          path: '${{ github.workspace }}/target/*.jar'
          retention-days: 1
  #--------------------------------------------------
  # Cypress
  #--------------------------------------------------
  cypress:
    needs: [tests-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 'Setup: checkout project'
        uses: actions/checkout@v7
      - name: 'Setup: environment'
        id: setup
        uses: ./.github/actions/setup
      - name: 'Artifact: download JAR'
        uses: actions/download-artifact@v8
        with:
          name: seed4j-jar
          path: ./tests-ci/
      - name: 'Init: install Node.js packages'
        run: npm ci
      - name: 'Test: start application Seed4J'
        working-directory: ./tests-ci/
        run: |
          ./start.sh 1339
      - name: 'Test: launch Cypress'
        run: npm run e2e:headless

  #--------------------------------------------------
  # Tests generated projects
  #--------------------------------------------------
  generation:
    needs: [setup, tests-linux, generate-main-branch-jar]
    # MongoDB 8.x refuses to start on Linux kernels 6.19 to 7.0.13 (https://jira.mongodb.org/browse/SERVER-121912)
    # ubuntu-latest now ships kernel 7.0.0: use ubuntu-22.04 (kernel 6.8) for mongodbapp until runners get kernel >= 7.0.14
    runs-on: ${{ matrix.app == 'mongodbapp' && 'ubuntu-22.04' || 'ubuntu-latest' }}
    timeout-minutes: 15
    if: >-
      !cancelled() &&
      needs.setup.outputs.skip_ci != 'true' &&
      needs.tests-linux.result == 'success' &&
      (needs.generate-main-branch-jar.result == 'success' ||
      needs.generate-main-branch-jar.result == 'skipped')
    strategy:
      matrix:
        app:
          - fullappmaven
          - fullappgradle
          - oauth2app
          - mysqlapp
          - mariadbapp
          - mssqlapp
          - flywayapp
          - eurekaapp
          - consulapp
          - gatewayapp
          - mongodbapp
          - redisapp
          - cassandraapp
          - neo4japp
          - angularjwtapp
          - reactapp
          - vuejwtapp
          - vueoauth2app
          - kafkaapp
          - pulsarapp
          - reactiveapp
          - angularoauth2app
          - seed4jextension
          - typescriptapp
          - thymeleafapp
          - langchain4japp
          - micronautapp
        include:
          - java-build-tool: maven
          - spring-config-format: yaml
          - node-package-manager: npm
          - java-version: 25
          - node-version: 'lts/*'
          - app: mariadbapp
            spring-config-format: properties
          - app: mongodbapp
            java-version: 26-ea
          - app: typescriptapp
            node-package-manager: pnpm
          - app: vueoauth2app
            node-package-manager: pnpm
          - app: vuejwtapp
            node-version: 'latest'
          - app: fullappgradle
            java-build-tool: gradle
    steps:
      - name: 'Setup: checkout project from main branch'
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: 'main'
          path: 'main-branch'
      - name: 'Setup: environment from main branch'
        if: github.event_name == 'pull_request'
        id: setup-main
        uses: ./main-branch/.github/actions/setup
      - name: 'Artifact: download JAR from main branch'
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v8
        with:
          name: seed4j-main-jar
          path: ./main-branch/tests-ci/
      - name: 'Generation: generate ${{ matrix.app }} from main branch'
        if: github.event_name == 'pull_request'
        working-directory: ./main-branch/tests-ci/
        continue-on-error: true
        id: generate-main
        run: |
          # Set up trap to ensure stop.sh is called on exit
          trap './stop.sh' EXIT

          ./start.sh 1339
          ./generate.sh ${{ matrix.app }} ${{ matrix.java-build-tool }} ${{ matrix.spring-config-format }} ${{ matrix.node-package-manager }}
          GENERATE_EXIT_CODE=$?
          echo "exit_code=$GENERATE_EXIT_CODE" >> $GITHUB_OUTPUT
          exit $GENERATE_EXIT_CODE
      - name: 'Generation: calculate md5sum ${{ matrix.app }} from main branch'
        if: github.event_name == 'pull_request'
        id: calculate-md5sum-main
        run: |
          if [ -d "/tmp/seed4j/${{ matrix.app }}" ] && [ "${{ steps.generate-main.outputs.exit_code }}" == "0" ]; then
            cd /tmp/seed4j/${{ matrix.app }}/
            app_md5=$(find . \
              -not -path './.git/*' \
              -not -path './.github/*' \
              -not -path './.seed4j/*' \
              -not -path './node_modules/*' \
              -not -path './target/*' \
              -not -path './build/*' \
              -type f -exec md5sum {} + | LC_ALL=C sort | md5sum | head -n1 | cut -d " " -f1)
            echo "hash=$app_md5" >> $GITHUB_OUTPUT
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "main branch hash from project ${{ matrix.app }} $app_md5"
          else
            echo "App does not exist in main branch or generation failed"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: 'Clean: delete ${{ matrix.app }} from main branch'
        if: github.event_name == 'pull_request'
        run: |
          rm -rf /tmp/seed4j/${{ matrix.app }}
      - name: 'Setup: checkout project'
        uses: actions/checkout@v7
        with:
          path: 'current-branch'
      - name: 'Setup: environment (java: ${{ matrix.java-version }}, node: ${{ matrix.node-version }}, node-package-manager: ${{ matrix.node-package-manager }})'
        id: setup
        uses: ./current-branch/.github/actions/setup
        with:
          java-version: ${{ matrix.java-version }}
          node-version: ${{ matrix.node-version }}
          node-package-manager: ${{ matrix.node-package-manager }}
      - name: 'Artifact: download JAR'
        uses: actions/download-artifact@v8
        with:
          name: seed4j-jar
          path: ./current-branch/tests-ci/
      - name: 'Generation: generate ${{ matrix.app }}'
        working-directory: ./current-branch/tests-ci/
        run: |
          ./start.sh 1339
          ./generate.sh ${{ matrix.app }} ${{ matrix.java-build-tool }} ${{ matrix.spring-config-format }} ${{ matrix.node-package-manager }}
          ./stop.sh
      - name: 'Generation: calculate md5sum ${{ matrix.app }}'
        if: github.event_name == 'pull_request' && steps.calculate-md5sum-main.outputs.exists == 'true'
        id: calculate-md5sum
        working-directory: /tmp/seed4j/${{ matrix.app }}/
        run: |
          app_md5=$(find . \
            -not -path './.git/*' \
            -not -path './.github/*' \
            -not -path './.seed4j/*' \
            -not -path './node_modules/*' \
            -not -path './target/*' \
            -not -path './build/*' \
            -type f -exec md5sum {} + | LC_ALL=C sort | md5sum | head -n1 | cut -d " " -f1)
          echo pull request branch hash from project ${{ matrix.app }} $app_md5
          echo "hash=$app_md5" >> $GITHUB_OUTPUT
          ls -al /tmp/seed4j/${{ matrix.app }}
      - name: 'Compare hash main x pull request ${{ matrix.app }}'
        if: github.event_name == 'pull_request' && steps.calculate-md5sum-main.outputs.exists == 'true'
        id: compare-hash
        run: |
          echo "main branch hash from project ${{ matrix.app }} ${{ steps.calculate-md5sum-main.outputs.hash }}"
          echo "pull request branch hash from project ${{ matrix.app }} ${{ steps.calculate-md5sum.outputs.hash }}"
          if [ "${{ steps.calculate-md5sum-main.outputs.hash }}" != "${{ steps.calculate-md5sum.outputs.hash }}" ]; then
            echo "different=true" >> $GITHUB_OUTPUT
          else
            echo "different=false" >> $GITHUB_OUTPUT
          fi
      - name: 'Determine if tests are needed'
        id: tests-requirement-check
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "Not a PR - will run tests"
            echo "execute_tests=true" >> $GITHUB_OUTPUT
          elif [[ "${{ steps.calculate-md5sum-main.outputs.exists }}" != "true" ]]; then
            echo "App doesn't exist in main branch - will run tests"
            echo "execute_tests=true" >> $GITHUB_OUTPUT
          elif [[ "${{ steps.compare-hash.outputs.different }}" == "true" ]]; then
            echo "Hashes are different - will run tests"
            echo "execute_tests=true" >> $GITHUB_OUTPUT
          else
            echo "Hashes are identical - will skip tests"
            echo "execute_tests=false" >> $GITHUB_OUTPUT
          fi
      - name: 'Test: list ${{ matrix.app }}'
        if: |
          steps.tests-requirement-check.outputs.execute_tests == 'true' &&
          matrix.java-build-tool == 'maven'
        id: maven-project
        working-directory: /tmp/seed4j/${{ matrix.app }}/
        run: |
          ls -al
          if [ -f 'pom.xml' ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          fi
      - name: 'Init: restore global Maven cache'
        if: steps.maven-project.outputs.exists == 'true'
        uses: ./current-branch/.github/actions/maven-cache-restore
        with:
          week: ${{ needs.setup.outputs.maven_cache_week }}
          fallback-week: ${{ github.event_name == 'pull_request' && needs.setup.outputs.maven_cache_previous_week || '' }}
      - name: 'Test: list ${{ matrix.app }}'
        if: |
          steps.tests-requirement-check.outputs.execute_tests == 'true' &&
          matrix.java-build-tool == 'gradle'
        id: cache_gradle_md5sum
        working-directory: /tmp/seed4j/${{ matrix.app }}/
        run: |
          ls -al
          GRADLE_DEPS_MD5=$(md5sum \
            build.gradle.kts \
            settings.gradle.kts \
            gradle/libs.versions.toml \
            gradle/wrapper/gradle-wrapper.properties \
            | md5sum | head -n1 | cut -d " " -f1)
          echo $GRADLE_DEPS_MD5
          echo "md5sum=${GRADLE_DEPS_MD5}" >> $GITHUB_OUTPUT
      - name: 'Init: restore local Gradle repository'
        if: |
          steps.tests-requirement-check.outputs.execute_tests == 'true' &&
          matrix.java-build-tool == 'gradle'
        id: restore-gradle-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-${{ matrix.java-build-tool }}-${{ matrix.app }}-${{ steps.cache_gradle_md5sum.outputs.md5sum }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.java-build-tool }}-
      - name: 'Test: detect Playwright component tests for ${{ matrix.app }}'
        if: steps.tests-requirement-check.outputs.execute_tests == 'true'
        id: playwright
        working-directory: /tmp/seed4j/${{ matrix.app }}/
        # Only component tests run in CI: apps with Playwright e2e tests alone do not need browsers
        run: |
          if [ -f 'package.json' ] && node -e "process.exit(/\bplaywright test\b/.test(require('./package.json').scripts?.['test:component:headless'] ?? '') ? 0 : 1)"; then
            PLAYWRIGHT_VERSION=$(node -p "require('./package.json').devDependencies['@playwright/test']")
            echo "Playwright component tests found, using @playwright/test ${PLAYWRIGHT_VERSION}"
            echo "enabled=true" >> $GITHUB_OUTPUT
            echo "version=${PLAYWRIGHT_VERSION}" >> $GITHUB_OUTPUT
          else
            echo "No Playwright component tests found"
          fi
      - name: 'Init: restore Playwright browsers'
        if: steps.playwright.outputs.enabled == 'true'
        id: restore-playwright-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
      - name: 'Test: starting Sonar'
        if: steps.tests-requirement-check.outputs.execute_tests == 'true'
        working-directory: /tmp/seed4j/${{ matrix.app }}/
        run: |
          if [ -f 'src/main/docker/sonar.yml' ]; then
            docker compose -f src/main/docker/sonar.yml up -d \
              && docker logs -f sonar-token && SONAR_TOKEN=$(docker logs sonar-token)
            docker ps -a
          fi
      - name: 'Install seed4j snapshot jar in local maven repository'
        if: steps.tests-requirement-check.outputs.execute_tests == 'true'
        working-directory: ./current-branch/
        run: |
          export SEED4J_VERSION=$(find tests-ci -maxdepth 1 -name "*-tests.jar" | sed -e 's/.*seed4j-\(.*\)-tests\.jar/\1/')
          echo "SEED4J_VERSION=${SEED4J_VERSION}"
          ./mvnw install:install-file -Dfile=tests-ci/seed4j-${SEED4J_VERSION}.jar -DgroupId=com.seed4j -DartifactId=seed4j -Dversion=${SEED4J_VERSION}
          ./mvnw install:install-file -Dfile=tests-ci/seed4j-${SEED4J_VERSION}-tests.jar -DgroupId=com.seed4j -DartifactId=seed4j -Dversion=${SEED4J_VERSION} -Dclassifier=tests
      - name: 'Test: verify ${{ matrix.app }}'
        if: steps.tests-requirement-check.outputs.execute_tests == 'true'
        working-directory: /tmp/seed4j/${{ matrix.app }}/
        run: |
          SONAR_TOKEN=$(docker logs sonar-token)
          if [ -f 'mvnw' ]; then
            ./mvnw clean verify -Dsonar.qualitygate.wait=true sonar:sonar -Dsonar.token=$SONAR_TOKEN
          elif [ -f 'gradlew' ]; then
            ./gradlew clean build sonar --no-daemon --info -Dsonar.token=$SONAR_TOKEN
          else
            ${{ matrix.node-package-manager }} install
            ${{ matrix.node-package-manager }} run test:coverage
            npx @sonar/scan -Dsonar.token=$SONAR_TOKEN
          fi
      - name: 'Test: run linter for ${{ matrix.app }}'
        if: steps.tests-requirement-check.outputs.execute_tests == 'true'
        working-directory: /tmp/seed4j/${{ matrix.app }}/
        run: |
          if grep -q '"lint":' package.json; then
            ${{ matrix.node-package-manager }} run lint
          else
            echo "No lint script in package.json found, skipping step."
          fi
      - name: 'Test: frontend component-tests for ${{ matrix.app }}'
        if: steps.tests-requirement-check.outputs.execute_tests == 'true'
        working-directory: /tmp/seed4j/${{ matrix.app }}/
        run: |
          if grep -q "test:component" package.json; then
            if [[ "${{ steps.playwright.outputs.enabled }}" == "true" ]]; then
              # Azure apt mirrors sometimes stall: give up idle connections and retry instead of hanging until the job timeout
              printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' \
                | sudo tee /etc/apt/apt.conf.d/99-ci-network > /dev/null
              npx playwright install --with-deps
            fi
            ${{ matrix.node-package-manager }} run test:component:headless
          else
            echo "No frontend component tests found, skipping step."
          fi
      - name: 'Save Playwright browsers'
        if: |
          steps.playwright.outputs.enabled == 'true' &&
          steps.restore-playwright-cache.outputs.cache-hit != 'true' &&
          github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.restore-playwright-cache.outputs.cache-primary-key }}
      - name: 'Test: check local Sonar Analysis'
        if: steps.tests-requirement-check.outputs.execute_tests == 'true'
        run: |
          if [ -f '/tmp/seed4j/${{ matrix.app }}/src/main/docker/sonar.yml' ]; then
            ./current-branch/tests-ci/sonar.sh ${{ matrix.app }}
          fi
      - name: 'Test: copy shell scripts'
        if: steps.tests-requirement-check.outputs.execute_tests == 'true'
        run: cp ./current-branch/tests-ci/start.sh /tmp/seed4j/${{ matrix.app }}/
      - name: 'Test: start docker-compose services'
        if: steps.tests-requirement-check.outputs.execute_tests == 'true'
        working-directory: ./current-branch/tests-ci/
        run: |
          ./start_docker_compose.sh /tmp/seed4j/${{ matrix.app }}/
      - name: 'Test: start the application'
        if: steps.tests-requirement-check.outputs.execute_tests == 'true'
        working-directory: /tmp/seed4j/${{ matrix.app }}/
        run: |
          if [ -f 'mvnw' ] || [ -f 'gradlew' ]; then
            ./start.sh
          fi
      - name: 'Maven cache: upload downloaded dependencies'
        if: |
          !cancelled() &&
          steps.maven-project.outputs.exists == 'true' &&
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main'
        uses: ./current-branch/.github/actions/maven-cache-delta
        with:
          name: ${{ matrix.app }}
      - name: 'Save local Gradle repository'
        if: |
          steps.restore-gradle-cache.outcome == 'success' &&
          steps.restore-gradle-cache.outputs.cache-hit != 'true' &&
          github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.restore-gradle-cache.outputs.cache-primary-key }}

  #--------------------------------------------------
  # Merge downloaded dependencies into the global Maven cache
  #--------------------------------------------------
  maven-cache:
    name: maven-cache
    needs: [setup, tests-linux, generation]
    if: >-
      !cancelled() &&
      needs.setup.outputs.skip_ci != 'true' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CACHE_PREFIX: Linux-m2-global-
    steps:
      - name: 'List Maven cache deltas'
        id: deltas
        run: |
          gh api --paginate "repos/$GH_REPO/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("m2-delta-")) | .name' > "$RUNNER_TEMP/m2-deltas.txt"
          cat "$RUNNER_TEMP/m2-deltas.txt"
          if [ -s "$RUNNER_TEMP/m2-deltas.txt" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "No new Maven dependency downloaded: keeping current cache"
          fi
      - name: 'Restore global Maven cache'
        if: steps.deltas.outputs.found == 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: ${{ env.CACHE_PREFIX }}${{ needs.setup.outputs.maven_cache_week }}-
      - name: 'Merge Maven cache deltas'
        if: steps.deltas.outputs.found == 'true'
        # Deltas are downloaded one at a time: on a cold week they hold whole repositories
        run: |
          mkdir -p ~/.m2
          while read -r name; do
            gh run download ${{ github.run_id }} --name "$name" --dir "$RUNNER_TEMP/$name"
            tar -xf "$RUNNER_TEMP/$name/m2-delta.tar" -C ~/.m2
            rm -rf "${RUNNER_TEMP:?}/$name"
          done < "$RUNNER_TEMP/m2-deltas.txt"
          du -sh ~/.m2/repository ~/.m2/wrapper || true
      - name: 'Save global Maven cache'
        if: steps.deltas.outputs.found == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: ${{ env.CACHE_PREFIX }}${{ needs.setup.outputs.maven_cache_week }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 'Delete outdated global Maven caches'
        if: steps.deltas.outputs.found == 'true'
        run: |
          current_key="${CACHE_PREFIX}${{ needs.setup.outputs.maven_cache_week }}-${{ github.run_id }}-${{ github.run_attempt }}"
          gh cache list --key "$CACHE_PREFIX" --limit 100 --json id,key \
            --jq ".[] | select(.key != \"$current_key\") | .id" \
            | xargs -r -n1 gh cache delete

  #--------------------------------------------------
  # Configuration for Status checks that are required
  #--------------------------------------------------
  status-checks:
    name: status-checks
    needs: [tests-linux, generation]
    permissions:
      contents: none
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validation Status checks
        run: |
          echo 'Configuration for Status checks that are required'
          echo '${{ toJSON(needs) }}'
          if [[ (('skipped' == '${{ needs.tests-linux.result }}') || ('success' == '${{ needs.tests-linux.result }}')) && (('skipped' == '${{ needs.generation.result }}') || ('success' == '${{ needs.generation.result }}')) ]]; then
            exit 0
          fi
          exit 1

  #--------------------------------------------------
  # Dependabot auto merge PR
  #--------------------------------------------------
  dependabot-auto-merge:
    name: dependabot-auto-merge
    needs: [cypress, generation]
    permissions:
      pull-requests: write
      contents: write
    runs-on: ubuntu-latest
    if: github.repository == 'seed4j/seed4j' && github.ref != 'refs/heads/main' && github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@v3.1.0
      - name: Enable auto-merge for Dependabot PRs
        if: steps.dependabot-metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
