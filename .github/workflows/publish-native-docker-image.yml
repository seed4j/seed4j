name: Build and publish native (GraalVM) images
on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

jobs:
  build_native_docker_image:
    name: Build and publish the native (GraalVM) Docker image
    runs-on: ubuntu-26.04
    env:
      DOCKER_IMAGE_NAME: '${{ github.repository_owner }}/seed4j-native'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.DOCKER_IMAGE_NAME }}

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'oracle'
          java-version: '25'
          check-latest: false

      - name: 'Init: compute Maven cache week'
        id: maven-cache-week
        run: echo "week=$(date -u +%G-W%V)" >> $GITHUB_OUTPUT
      - name: 'Init: restore global Maven cache'
        uses: ./.github/actions/maven-cache-restore
        with:
          week: ${{ steps.maven-cache-week.outputs.week }}

      - name: Build application with Buildpacks
        run: |
          ./mvnw -Pnative -DskipTests -pl seed4j-server clean spring-boot:build-image -Dspring-boot.build-image.imageName=${{ env.DOCKER_IMAGE_NAME }}

      - name: Test native image
        working-directory: tests-ci
        run: ./start_docker_container.sh ${{ env.DOCKER_IMAGE_NAME }}

      - name: Login to Docker Registry
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: docker/login-action@v4.7.0
        id: login-hub
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag the native (GraalVM) Docker image and push it
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker tag ${{ env.DOCKER_IMAGE_NAME }} ${{ env.DOCKER_IMAGE_NAME }}:latest
          docker tag ${{ env.DOCKER_IMAGE_NAME }} ${{ env.DOCKER_IMAGE_NAME }}:${{  github.ref_name }}
          docker push --all-tags ${{ env.DOCKER_IMAGE_NAME }}
