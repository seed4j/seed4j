name: Release Drafter
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  update_release_draft:
    if: github.repository == 'seed4j/seed4j'
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        id: release-drafter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
